name: Feature request
description: Propose a focused analytical or product improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What decision or workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Statistical or technical rationale
  - type: textarea
    id: limits
    attributes:
      label: Risks, limitations, and alternatives
